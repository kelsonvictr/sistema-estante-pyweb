{% extends "base.html" %}

{% block titulo %}{{ 'Editar leitor' if modo == 'editar' else 'Novo leitor' }} — Estante{% endblock %}

{% block conteudo %}
    <h1>{{ 'Editar leitor' if modo == 'editar' else 'Novo leitor' }}</h1>

    <div class="card">
        <form class="formulario" method="post">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" value="{{ leitor.nome or '' }}">
            </div>
            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{{ leitor.email or '' }}">
            </div>
            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="text" id="telefone" name="telefone" value="{{ leitor.telefone or '' }}">
            </div>
            <div class="formulario__acoes">
                <button type="submit" class="botao botao--principal">Salvar</button>
                <a class="botao botao--secundario" href="{{ url_for('leitores') }}">Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}
