{% extends "base.html" %}

{% block titulo %}{{ 'Editar livro' if modo == 'editar' else 'Novo livro' }} — Estante{% endblock %}

{% block conteudo %}
    <h1>{{ 'Editar livro' if modo == 'editar' else 'Novo livro' }}</h1>

    <div class="card">
        <form class="formulario" method="post">
            <div class="campo">
                <label for="titulo">Título</label>
                <input type="text" id="titulo" name="titulo" value="{{ livro.titulo or '' }}">
            </div>
            <div class="campo">
                <label for="autor">Autor</label>
                <input type="text" id="autor" name="autor" value="{{ livro.autor or '' }}">
            </div>
            <div class="campo">
                <label for="ano">Ano</label>
                <input type="number" id="ano" name="ano" value="{{ livro.ano or '' }}">
            </div>
            <div class="campo">
                <label for="exemplares">Exemplares</label>
                <input type="number" id="exemplares" name="exemplares" min="1" value="{{ livro.exemplares or '' }}">
            </div>
            <div class="formulario__acoes">
                <button type="submit" class="botao botao--principal">Salvar</button>
                <a class="botao botao--secundario" href="{{ url_for('livros') }}">Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}
