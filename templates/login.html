<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Estante</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login">
        <div class="card login__card">
            <div class="menu-lateral__marca">📚 Estante</div>
            <p class="texto-secundario">Biblioteca comunitária · entre para continuar</p>

            {% with mensagens = get_flashed_messages(with_categories=true) %}
                {% if mensagens %}
                    <div class="flashes">
                        {% for categoria, mensagem in mensagens %}
                            <div class="flash flash--{{ categoria }}">{{ mensagem }}</div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form class="formulario" method="post" action="{{ url_for('login') }}">
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" required autofocus>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" required>
                </div>
                <button type="submit" class="botao botao--principal">Entrar</button>
            </form>
        </div>
    </div>
</body>
</html>
